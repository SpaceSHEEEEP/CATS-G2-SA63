name: Manual CATS build, test, Android package, image publish and deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Build and publish the image, sign Android APK and deploy to production'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Spring Boot tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Test-only key. Production key is only on the deployed host.
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SPRING_PROFILES_ACTIVE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit and repository tests (Linux and macOS)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon clean test bootJar
      - name: Run unit and repository tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean test bootJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report-${{ matrix.os }}
          path: build/reports/tests/test/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: spring-boot-jar
          path: build/libs/*SNAPSHOT.jar
          if-no-files-found: error

  mobile:
    name: Angular & Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default includes the removed legacy Android SDK "tools" package.
          packages: 'platform-tools'
      - name: Install Angular and Capacitor dependencies
        working-directory: mobile
        run: |
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Compile Angular and sync native encrypted storage plugin
        working-directory: mobile
        run: npm run build && npm run android:init
      - name: Build unsigned-distribution debug APK for testers
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cats-mobile-debug-apk-not-for-production
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Compile signed release APK (only when deploying)
        if: inputs.deploy == true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for setting in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if test -z "${!setting}"; then echo "Missing required Android signing secret: ${setting}" >&2; exit 1; fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cats-release.jks"
          chmod 600 "$RUNNER_TEMP/cats-release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/cats-release.jks"
          (cd mobile/android && ./gradlew --no-daemon assembleRelease)
          mkdir -p staging
          cp mobile/android/app/build/outputs/apk/release/app-release.apk staging/CATS-Mobile.apk
          rm -f "$ANDROID_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        if: inputs.deploy == true
        with:
          name: cats-mobile-signed-release
          path: staging/CATS-Mobile.apk
          if-no-files-found: error

  image:
    name: Build and publish backend / Angular Docker image
    if: inputs.deploy == true
    needs: [backend-tests, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image-name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: image-name
        name: Normalize container name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image-name.outputs.name }}:${{ github.sha }}
            ${{ steps.image-name.outputs.name }}:latest

  deploy:
    name: Production deploy over pinned-host-key SSH
    if: inputs.deploy == true
    needs: [backend-tests, mobile, image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cats-mobile-signed-release
          path: staging
      - name: Stage deployment files
        run: |
          mkdir -p staging/deploy
          cp deploy/compose.production.yml deploy/compose.database.yml deploy/stack.sh staging/deploy/
          mv staging/CATS-Mobile.apk staging/CATS-Mobile.new.apk
      - name: Validate required deployment connection secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for setting in DEPLOY_HOST DEPLOY_USERNAME DEPLOY_PASSWORD DEPLOY_HOST_FINGERPRINT; do
            if test -z "${!setting}"; then echo "Missing required deployment secret: ${setting}" >&2; exit 1; fi
          done
      - name: Copy signed APK and compose declaration to the server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          source: staging/*
          target: /opt/cats
          strip_components: 1
      - name: Deploy immutable Docker tag; verify health; rollback on failure
        uses: appleboy/ssh-action@v1
        env:
          CATS_IMAGE: ${{ needs.image.outputs.image_name }}:${{ github.sha }}
          DEPLOY_DB_MODE: ${{ vars.DEPLOY_DB_MODE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: CATS_IMAGE,DEPLOY_DB_MODE
          script: |
            set -eu
            cd /opt/cats
            test -r .env.production
            test -s CATS-Mobile.new.apk
            if test -s CATS-Mobile.apk; then cp CATS-Mobile.apk CATS-Mobile.previous.apk; fi
            mv CATS-Mobile.new.apk CATS-Mobile.apk
            # Resolve the same database switch used by manual SSH deployments.
            # An optional Actions environment override takes precedence over .env.production.
            mode=$(sh deploy/stack.sh mode)
            if [ "$mode" = container ]; then
              # Compose starts MySQL only in this mode, with its own named volume.
              sh deploy/stack.sh up -d --wait db
            fi
            previous=$(sed -n 's/^CATS_IMAGE=//p' .env.production | tail -1)
            sh deploy/stack.sh pull cats
            sh deploy/stack.sh up -d --no-deps cats
            # Check the container's internal HTTP health status, not a TLS endpoint or
            # a fixed host port. The public HTTP listener depends on the chosen ingress.
            healthy=false
            for i in $(seq 1 24); do
              container_id=$(sh deploy/stack.sh ps -q cats)
              if [ -n "$container_id" ]; then
                container_health=$(docker inspect --format '{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)
                if [ "$container_health" = healthy ]; then
                  healthy=true
                  break
                fi
              fi
              sleep 5
            done
            if [ "$healthy" != true ]; then
              echo 'Deployment failed health check.' >&2
              if [ -s CATS-Mobile.previous.apk ]; then mv CATS-Mobile.previous.apk CATS-Mobile.apk; fi
              if [ -n "$previous" ]; then
                export CATS_IMAGE="$previous"
                sh deploy/stack.sh up -d --no-deps cats
              fi
              exit 1
            fi
            rm -f CATS-Mobile.previous.apk
            sed -i '/^CATS_IMAGE=/d' .env.production
            # A hand-edited dotenv file may have no final newline. Ensure the
            # image tag is a separate variable rather than part of the last value.
            if [ "$(tail -c 1 .env.production | wc -l)" -eq 0 ]; then
              printf '\n' >> .env.production
            fi
            printf 'CATS_IMAGE=%s\n' "$CATS_IMAGE" >> .env.production
            echo 'Deployment healthy; immutable image tag recorded.'
