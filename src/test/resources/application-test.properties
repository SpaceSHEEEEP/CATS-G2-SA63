spring.application.name=cats

# create cats_test as database, must running MySQL
# Requires local MySQL and DB_USERNAME / DB_PASSWORD in the test environment.
# Disposable database: create-drop recreates tables and drops them after testing.
spring.datasource.url=jdbc:mysql://localhost:3306/cats_test?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Load data.sql into MySQL after Hibernate has created the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Show the exception message on the error page (e.g. "Employee x not found")
server.error.include-message=always