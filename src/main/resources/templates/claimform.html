<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" th:href="@{/images/cats/celebrate.png}" />
    <title>Course fee claim</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
    <script th:src="@{/js/captcha.js}" defer></script>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <h1>Submit course-fee reimbursement claim</h1>
    <p th:text="${claimApplication.course.courseName}"></p>
    <p>
      Attach both a receipt proving personal payment and a certificate of
      completion (PDF, PNG or JPEG, each under 5 MB).
    </p>
    <form
      th:action="@{/staff/claim}"
      method="post"
      enctype="multipart/form-data"
    >
      <input
        type="hidden"
        name="applicationId"
        th:value="${claimApplication.id}"
      />
      <label
        >Receipt
        <input
          type="file"
          name="receipt"
          accept="application/pdf,image/png,image/jpeg"
          required
      /></label>
      <label
        >Completion certificate
        <input
          type="file"
          name="certificate"
          accept="application/pdf,image/png,image/jpeg"
          required
      /></label>
      <div th:replace="~{fragments/captcha :: widget('fee-claim')}"></div>
      <button type="submit">Submit claim for manager approval</button>
    </form>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
