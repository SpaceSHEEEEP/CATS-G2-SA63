<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Course catalogue maintenance</title><link rel="stylesheet" th:href="@{/style.css}" /></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<h1>Course catalogue maintenance</h1>
<p th:if="${error}" th:text="${error}" role="alert"></p>
<form th:action="@{/admin/course/save}" th:object="${courseForm}" method="post">
  <input type="hidden" th:field="*{courseId}" />
  <p th:if="${#fields.hasAnyErrors()}" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
  <label>Course title <input type="text" th:field="*{courseName}" required /></label>
  <label>Category <select th:field="*{courseType}" required>
    <option value="INTERNAL">Internal</option><option value="EXTERNAL">External</option>
    <option value="PROFESSIONAL">Professional certification</option></select></label>
  <label>Start date <input type="date" th:field="*{startDate}" required /></label>
  <label>End date <input type="date" th:field="*{endDate}" required /></label>
  <label>Session <select th:field="*{duration}" required><option value="FULLDAY">Full day</option>
    <option value="HALFDAYAM">Half day AM</option><option value="HALFDAYPM">Half day PM</option></select></label>
  <label>Location <input type="text" th:field="*{location}" required /></label>
  <label>Provider <input type="text" th:field="*{trainingProvider}" required /></label>
  <label>Course fee <input type="number" th:field="*{fee}" min="0" step="0.01" required /></label>
  <p>Editing a course with existing applications creates a new catalogue version, preserving historical data.</p>
  <button type="submit">Save course</button>
</form><p><a th:href="@{/admin/index}">Back to administration</a></p>
</body></html>
