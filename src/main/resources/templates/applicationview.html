<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="EN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/style.css}" />
  <title>Application Details</title>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <h1>Application Details</h1>

    <div class="details-card">
        <dl class="details-grid">

            <dt>Application ID</dt>
            <dd th:text="${applicationView.id}"></dd>

            <dt>Course Name</dt>
            <dd th:text="${applicationView.course.courseName}"></dd>

            <dt>Course Type</dt>
            <dd><span class="badge" th:text="${applicationView.course.courseType}"></span></dd>

            <dt>Start Date</dt>
            <dd th:text="${applicationView.course.startDate}"></dd>

            <dt>End Date</dt>
            <dd th:text="${applicationView.course.endDate}"></dd>

            <dt>Duration</dt>
            <dd th:text="${applicationView.course.duration}"></dd>

            <dt>Training Provider</dt>
            <dd th:text="${applicationView.course.trainingProvider}"></dd>

            <dt>Location</dt>
            <dd th:text="${applicationView.course.location}"></dd>

            <dt>Fee</dt>
            <dd>$<span th:text="${applicationView.course.fee}"></span></dd>

            <dt>User's Justification</dt>
            <dd class="full-width" th:text="${applicationView.userReason}"></dd>

            <dt>Status</dt>
            <dd><span th:text="${applicationView.Status}"></span></dd>

        </dl>
    </div>

    <h3>Manager's Justification</h3>
    <div>
        <form th:action="@{/manager/application/status}" method="post">
            <input type="hidden" name="id" th:value="${applicationView.id}">
            <textarea name="managerReason" placeholder="Enter reason" rows="5" width="100%"></textarea>
            <!-- TODO: add validation to this form -->
            <!-- <span class="field-error-message" th:if="${#fields.hasErrors('managerReason')}" th:errors="*{userReason}"/> -->
            <button type="submit" name="status" value="APPROVED">Approve</button>
            <button type="submit" name="status" value="REJECTED">Reject</button>
        </form>
    </div>

</body>
</html>
