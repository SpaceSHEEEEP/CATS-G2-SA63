<!DOCTYPE html>
<HTML lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> 
	<head>
        <title>My Training</title>
        <link rel="stylesheet" th:href="@{/style.css}"/>
	</head>
	<body>
        <div th:replace="~{fragments/header :: header}"></div>

        <h1>My Training</h1>
        <p th:text="${'Welcome ' + user.name + '!'}"></p>

        <div class="actions">
            <a th:href="@{/staff/courselist}">View Courses</a>  
            <a th:href="@{/staff/apply}">Apply for a Course</a>
            <a th:href="@{/staff/calendar}">View Calendar</a>
        </div>

        <!-- display user details -->
        <div class="user-statistics-container">
          <div class="user-days-statistics">
            <p th:text="'Actual Days Left: ' + ${trainingSummary.dayLimit - trainingSummary.daysCompleted}"></p>
            <p th:text="'Budgeted Days Left: ' + ${trainingSummary.daysRemaining}"></p>
          </div>
          <div class="user-allowance-statistics">
            <p th:text="'Actual Allowance Remaining: $' + ${trainingSummary.feeLimit.subtract(trainingSummary.feesCompleted)}"></p>
            <p th:text="'Budgeted Allowance Remaining: $' + ${trainingSummary.budgetRemaining}"></p>
          </div>
          <div class="user-applications-statistics">
            <p th:text="'Number of Pending Applications: ' + ${pendingCount}"></p>
          </div>
        </div>

        <!-- display success message for every application made, updated, deleted and completed -->
        <div th:if="${successmsg}" th:text="${successmsg}" class="global-success-message"></div>

        <!-- display error message for exception handling -->
        <div th:if="${errormsg}" th:text="${errormsg}" class="global-error-message"></div>

        <!-- Current-year history only; links preserve selected page size. -->
        <h2>Personal Course History (<span th:text="${year}"></span>)</h2>
        <p th:if="${#lists.isEmpty(applications)}">You have no course records this year.</p>
        <div th:unless="${#lists.isEmpty(applications)}"
            th:replace="~{fragments/applicationlist :: applicationList(${applications})}"></div>
        <form method="get" th:action="@{/staff/index}">
            <label>Results per page <select name="pageSize" onchange="this.form.submit()">
              <option th:each="n : ${pageSizes}" th:value="${n}" th:text="${n}" th:selected="${n == pageSize}"></option>
            </select></label>
        </form>
        <nav aria-label="Personal application pages">
            <a th:if="${pageNum > 0}" th:href="@{/staff/index(pageNum=${pageNum - 1},pageSize=${pageSize})}">Previous</a>
            <span th:text="|${pageNum + 1} / ${totalPages == 0 ? 1 : totalPages}|"></span>
            <a th:if="${pageNum + 1 < totalPages}" th:href="@{/staff/index(pageNum=${pageNum + 1},pageSize=${pageSize})}">Next</a>
        </nav>

  </body>
</html>
