<!DOCTYPE html>
<HTML lang="en" xmlns:th="http://www.thymeleaf.org"> 
	<head>
        <title>My Training</title>
        <link rel="stylesheet" th:href="@{/style.css}"/>
	</head>
	<body>
        <div th:replace="~{fragments/header :: header}"></div>

        <div th:if="${session.user}">
            <h1>My Training</h1>
            <p>Welcome <span th:text="${session.user.name}"></span>.</p>
        </div>
        <div th:unless="${session.user}">
          <h1>Welcome! This is the index page</h1>
        </div>

        <div class="actions">
            <a th:href="@{/staff/courselist}">View internal courses</a>
            <a th:if="${isManager}" th:href="@{/manager/applications}">Team Training</a>
            <a th:href="@{/staff/apply}">Apply for a course</a>
            <a th:href="@{/staff/calendar}">View Calendar</a>
        </div>

        <!-- display user details -->
        <div th:if ="${session.user}" class="user-statistics-container">
          <div class="user-days-statistics">
            <p th:text="'Days Total: ' + ${session.user.daysTotal}"></p>
            <p th:text="'Budgeted Days Left: ' + ${session.user.budgetedDaysRemaining}"></p>
            <p th:text="'Actual Days Left: ' + ${session.user.actualDaysRemaining}"></p>
          </div>
          <div class="user-allowance-statistics">
            <p th:text="'Allowance Total: $' + ${session.user.allowanceTotal}"></p>
            <p th:text="'Budgeted Allowance Remaining: $' + ${session.user.budgetedAllowanceRemaining}"></p>
            <p th:text="'Actual Allowance Remaining: $' + ${session.user.actualAllowanceRemaining}"></p>
          </div>
          <div class="user-applications-statistics">
            <p th:text="'Number of Pending Applications: ' + ${session.user.countPendingApplications()}"></p>
          </div>
        </div>

        <!-- display success message for every application made or deleted -->
        <div th:if="${successmsg}" th:text="${successmsg}" class="global-success-message"></div>

        <!-- display error message for exception handling -->
        <div th:if="${errormsg}" th:text="${errormsg}" class="global-error-message"></div>

        <!-- user's personal course history -->
        <p th:if="${#lists.isEmpty(applications)}">You have not applied for any courses.</p>
        <span th:unless=${#lists.isEmpty(applications)}>
            <h2>Personal Course History</h2>
            <span th:replace="~{fragments/applicationlist :: applicationList(${applications})}"></span>
        </span>

  </body>
</html>
