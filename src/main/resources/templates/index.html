<!DOCTYPE html>
<HTML lang="en" xmlns:th="http://www.thymeleaf.org"> 
	<head>
        <title>My Training</title>
        <link rel="stylesheet" th:href="@{/style.css}" />
	</head>
	<body>
        <div th:replace="~{fragments/header :: header}">
		</div>

    <div th:if="${session.user}">
		<h1>My Training</h1>
		<p>Welcome <span th:text="${session.user.name}"></span>.</p>
    </div>
    <div th:unless="${session.user}">
      <h1>Welcome! This is the index page</h1>
    </div>

    <div class="index_actions">
        <a th:href="@{/staff/courselist}">View internal courses</a>
        <a th:if="${isManager}" th:href="@{/manager/applications}">Team Training</a>
        <a th:href="@{/staff/apply}">Apply for a course</a>
    </div>

    <!-- display user details -->
    <div th:if ="${session.user}">
      <p th:text="'Days Left :' + ${session.user.days}"></p>
      <p th:text="'Budget Remaining: $' + ${session.user.budget}"></p>
      <p th:text="'Number of Pending Applications: ' + ${session.user.countPendingApplications()}"></p>
    </div>

    <p th:if="${#lists.isEmpty(applications)}">
      You have not applied for any courses.
    </p>
    <table th:unless="${#lists.isEmpty(applications)}">
      <thead>
        <tr>
          <th>application id</th>
          <th>Course Name</th>
          <th>Course Type</th>
          <th>Duration</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Fee</th>
          <th>Comments</th>
          <th>Status</th>
          <th>Edit?</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="app : ${applications}">
          <td th:text="${app.applicationId}"></td>
          <td th:text="${app.course.courseName}"></td>
          <td th:text="${app.course.courseType}"></td>
          <td th:text="${app.course.duration}"></td>
          <td th:text="${#temporals.format(app.course.startDate, 'dd-MM-yyyy')}"></td>
          <td th:text="${#temporals.format(app.course.endDate, 'dd-MM-yyyy')}"></td>
          <td th:text="'$' + ${app.course.fee}"></td>

          <td th:text="${app.userReason}"></td>
          <td th:text="${app.applicationStatus}"></td>
          <td><a th:href="@{/staff/edit(applicationId=${app.applicationId})}">Edit</a></td>
        </tr>
      </tbody>
    </table>

  </body>
</html>
