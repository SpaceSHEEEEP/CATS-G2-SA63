<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <th:block th:fragment="header">
      <header
        class="cats-header"
        th:classappend="${#authorization.expression('hasRole(&quot;ADMIN&quot;)')} ? 'cats-header--admin'"
      >
        <a class="cats-header-home" th:href="@{/}" aria-label="CATS homepage">
          <img
            class="cats-header-logo"
            th:src="@{/images/cats/celebrate.png}"
            alt=""
            width="52"
            height="52"
          />
        </a>
        <strong class="cats-header-title">CATS for NUS-ISS</strong>

        <div sec:authorize="isAuthenticated()">
          Logged in as: <span sec:authentication="name">Username</span>
        </div>

        <a th:href="@{/staff/index}">My Training</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/staff/claims}"
          >My Claims</a
        >
        <a sec:authorize="isAuthenticated()" th:href="@{/staff/ledger}"
          >My Ledger</a
        >
        <a sec:authorize="isAuthenticated()" th:href="@{/staff/mobile}"
          >Mobile / MFA</a
        >
        <a
          class="cats-team-link"
          th:if="${isManager}"
          th:href="@{/manager/applications}"
          >Team Training</a
        >
        <a
          class="cats-team-link"
          th:if="${isManager}"
          th:href="@{/manager/claims}"
          >Team Claims</a
        >
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/claims}"
          >Reimbursements</a
        >
        <a
          class="cats-admin-link"
          sec:authorize="hasRole('ADMIN')"
          th:href="@{/admin/index}"
          >Administration</a
        >
        <a
          class="cats-calendar-link"
          sec:authorize="isAuthenticated()"
          th:href="@{/staff/calendar}"
          >Calendar</a
        >
        <form
          sec:authorize="!hasRole('ADMIN')"
          th:action="@{/logout}"
          method="post"
        >
          <button type="submit">Logout</button>
        </form>
        <form
          sec:authorize="hasRole('ADMIN')"
          th:action="@{/admin/logout}"
          method="post"
        >
          <button type="submit">Logout</button>
        </form>
      </header>
      <dialog id="cats-action-confirm-dialog" class="cats-action-confirm" aria-labelledby="cats-action-confirm-title" aria-describedby="cats-action-confirm-message">
        <form id="cats-action-confirm-form" action="/" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <h2 id="cats-action-confirm-title">Confirm action</h2>
          <p class="cats-action-subject" id="cats-action-confirm-subject"></p>
          <p class="cats-action-warning" id="cats-action-confirm-message" role="alert"></p>
          <label for="cats-action-confirm-input">Type <strong id="cats-action-confirm-phrase"></strong> to proceed</label>
          <input id="cats-action-confirm-input" name="confirmation" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required />
          <div id="cats-action-extra-wrapper" hidden>
            <label for="cats-action-extra-input" id="cats-action-extra-label">Additional details</label>
            <input id="cats-action-extra-input" type="text" maxlength="255" disabled />
          </div>
          <div class="cats-action-dialog-buttons">
            <button type="button" class="secondary" id="cats-action-confirm-cancel">Cancel</button>
            <button type="submit" class="danger" id="cats-action-confirm-submit" disabled>Confirm</button>
          </div>
        </form>
      </dialog>
      <script th:src="@{/js/table-actions.js}" defer></script>
    </th:block>
  </body>
</html>
