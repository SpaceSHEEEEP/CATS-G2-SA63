<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>

        <th:block th:fragment="header">

            <header class="cats-header">
				<strong class="cats-header-title">CATS for NUS-ISS</strong>

				<span th:if="${session.user != null}"
				      th:text="${'Logged in as ' + session.user.name}">
				</span>
				
                <a th:href="@{/staff/index}">Training</a>
				<a th:if="${session.user != null and session.user.admin}" th:href="@{/admin}">
					Administration</a>
                <a th:href="@{/staff/login}">Login Page</a>
                <a th:href="@{/staff/clear_session}">Clear Session</a>
            </header>

        </th:block>

    </body>
</html>
