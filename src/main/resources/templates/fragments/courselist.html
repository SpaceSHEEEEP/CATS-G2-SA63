<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <body>

    <th:block th:fragment="courseList(courses)">
        <table>
            <thead>
                <tr>
                <th>Course</th>
                <th>Start date</th>
                <th>End date</th>
                <th>Course Type</th>
                <th>Course Duration</th>
                <th>Training Provider</th>
                <th>Location</th>
                <th>Actions</th>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(courses.content)}" class="table-empty-row">
                  <td colspan="8"><div class="table-empty-state">
                    <img th:src="@{/images/cats/tearful.png}" alt="" />
                    <p>No courses on this page yet.</p>
                  </div></td>
                </tr>

                <tr th:each="course : ${courses.content}">
                <td class="course-name" th:text="${course.courseName}"></td>
                <td th:text="${#temporals.format(course.startDate, 'dd-MM-yyyy')}"></td>
                <td th:text="${#temporals.format(course.endDate, 'dd-MM-yyyy')}"></td>
                <td th:text="${course.courseType}"></td>
                <td th:text="${course.duration}"></td>
                <td th:text="${course.trainingProvider}"></td>
                <td th:text="${course.location}"></td>
                <td class="row-actions-cell">
              <div class="row-actions">
              <a class="row-action-icon" title="Apply for course" aria-label="Apply for course" th:href="@{/staff/apply(courseId=${course.courseId})}">
              <svg class="row-action-svg" aria-hidden="true">
              <use href="/images/icons/action-icons.svg#plus">
              </use>
              </svg>
              </a>
              </div>
            </td>

            </tbody>

        </table>
    </th:block>

    </body>
</html>
