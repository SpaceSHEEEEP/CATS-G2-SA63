<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <body>

        <th:block th:fragment="approveOrReject(app)">
            <h3>Manager's Justification</h3>
            <div>
                <form th:action="@{/manager/application/status}" method="post">
                    <input type="hidden" name="id" th:value="${app.id}">
                    <textarea name="managerReason" placeholder="Enter reason" rows="5" width="100%" required></textarea>
                    <!-- TODO: add validation to this form -->
                    <!-- <span class="field-error-message" th:if="${#fields.hasErrors('managerReason')}" th:errors="*{userReason}"/> -->
                    <!-- this shouldn't be blank if it's included in the webpage -->
                    <button type="submit" name="status" value="APPROVED">Approve</button>
                    <button type="submit" name="status" value="REJECTED">Reject</button>
                </form>
            </div>
        </th:block>


        <th:block th:fragment="showManagerReason(app)">
            <div class="details-card">
                <dl class="details-grid">
                    <dt> Manager's Reason</dt>
                    <dd class="full-width" th:text="${app.managerReason}"></dd>
                </dl>
            </div>
        </th:block>


        <th:block th:fragment="showComment(comment)">
            <div class="details-card">
                <dl class="details-grid">
                    <dt>Experience Comments</dt>
                    <dd class="full-width" th:text="${comment.commentText}"></dd>
                </dl>
            </div>
        </th:block>
        

        <th:block th:fragment="editOrDelete(app)">
            <div class="actions application-actions">
                <a th:href="@{/staff/edit(id=${app.id})}" class="btn btn-primary">Edit Application</a>
                <button type="button" class="btn btn-danger"
                        th:attr="popovertarget=|delete-confirmation-${app.id}|">Delete Application</button>
            </div>
            <div class="cats-confirmation" popover="auto" role="dialog"
                 th:id="|delete-confirmation-${app.id}|"
                 th:attr="aria-labelledby=|delete-heading-${app.id}|">
                <h2 th:id="|delete-heading-${app.id}|">Delete this application?</h2>
                <p><strong th:text="${app.course.courseName}"></strong> will be marked as deleted.</p>
                <div class="actions">
                    <button type="button" class="confirmation-cancel"
                            th:attr="popovertarget=|delete-confirmation-${app.id}|"
                            popovertargetaction="hide">Keep Application</button>
                    <form th:action="@{/staff/delete(id=${app.id})}" method="post">
                        <button type="submit" class="btn btn-danger"
                                onclick="return confirm('Delete this course application?')">Yes, Delete</button>
                    </form>
                </div>
            </div>
        </th:block>

        
        <th:block th:fragment="cancelOrComplete(app, comment)">
            <div class="actions">
              <form th:action="@{/staff/cancel(id=${app.id})}" method="post">
                <button type="submit">Cancel approved application</button>
              </form>
              <form th:if="${canComplete}"
                    th:action="@{/staff/completed(id=${app.id})}" method="post">
                <fieldset><label>Comments about your experience</label>
                  <textarea name="commentText" rows="5" maxlength="1000" required></textarea></fieldset>
                <button type="submit">Mark completed</button>
              </form>
            </div>
        </th:block>


    </body>
</html>
