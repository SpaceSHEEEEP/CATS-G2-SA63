<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="EN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/style.css}" />
    <title>User Form</title>
  </head>

  <body>
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="form-header">
          <h3>User Form</h3>
        </div>

        <div class="form-container">
          <form th:action="@{/admin/createuser}" th:object="${userForm}" method="POST">
            <!-- error summary banner -->
            <div class="global-error-banner" th:if="${#fields.hasAnyErrors()}">
              <p>Summary of Errors</p>
              <ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"/></ul>
              <p> Unable to submit application. Please re-enter fields or review again before submitting.</p>
            </div>
            <p th:if="${error}" class="field-error-message">Error from service validation: <span th:text="${error}"></span></p>

            <input type="hidden" th:field="*{userId}">

            <div class="form-fields-section">
            <!-- User's info-->
              <h3>User Personal Details</h3>
              <fieldset>
                <label>Name:</label>
                <input type="text" th:field="*{name}"/>
                <span class="field-error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"/>
              </fieldset>

              <fieldset>
                <label>Username:</label>
                <input type="text" th:field="*{username}" required />
                <span class="field-error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"/>
              </fieldset>

              <fieldset>
                <label>Email:</label>
                <input type="email" th:field="*{email}" required />
                <span class="field-error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"/>
              </fieldset>

              <fieldset><label>Password <small>(required for new users; leave blank to retain on edit)</small>:</label>
                <input type="password" th:field="*{password}" minlength="10" autocomplete="new-password" />
              </fieldset>

              <h3>User role and approval hierarchy</h3>
              <fieldset><label>Role:</label>
                <select th:field="*{role}" required>
                  <option value="ROLE_EMPLOYEE">Employee</option>
                  <option value="ROLE_MANAGER">Manager</option>
                  <option value="ROLE_ADMIN">Administrator</option>
                </select>
              </fieldset>
              <fieldset><label>Designation:</label>
                <select th:field="*{designation}" required>
                  <option value="ADMINISTRATIVE">Administrative</option>
                  <option value="PROFESSIONAL">Professional</option>
                </select>
              </fieldset>
              <fieldset><label>Reports to:</label>
                <select th:field="*{managerId}">
                  <option value="">No supervisor</option>
                  <option th:each="mngr : ${managers}" th:unless="${mngr.userId == userForm.userId}"
                          th:value="${mngr.userId}" th:text="${mngr.name}"></option>
                </select>
              </fieldset>
              <fieldset><label>Account enabled:</label>
                <input type="checkbox" th:field="*{enabled}" />
              </fieldset>

              <h3>Annual training allocation</h3>
              <fieldset><label>Calendar year:</label>
                <input type="number" th:field="*{year}" min="2000" max="9999" required />
              </fieldset>
              <fieldset><label>Annual training days entitlement:</label>
                <input type="number" th:field="*{annualDays}" step="0.5" min="0" required />
              </fieldset>
              <fieldset><label>Annual training allowance (SGD):</label>
                <input type="number" th:field="*{annualAllowance}" step="0.01" min="0" required />
              </fieldset>

              <div class="form-buttons">
                <button type="submit">Save User</button>
                <button type="reset">Reset</button>
              </div>
            </div>
          </form>
        </div>
  </body>
  </html>
