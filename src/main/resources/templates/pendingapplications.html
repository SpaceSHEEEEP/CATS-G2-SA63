<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/cats-logo.svg}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Training</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

		<!-- display success message for every application approved or rejected -->
    <div th:if="${successmsg}" th:text="${successmsg}" class="global-success-message"></div>

    <h1>Team Training</h1>
<div class="actions manager-navigation" role="navigation" aria-label="Team training pages">
    <a aria-current="page" th:href="@{/manager/applications}">Team Training</a>
    <a th:href="@{/manager/history}">Subordinate Course History</a>
    <a th:href="@{/manager/reports}">Training and Budget Reports</a>
</div>

		<h2>Search Team Applications</h2>
		<form th:action="@{/manager/applications/search}" method="get">

			<label for="employeeName">Employee Name:</label>
			<input type="text" name="employeeName">
			
				<label for="startDate">Start Date:</label>
				<input type="date" name="startDate">

				<label for="endDate">End Date:</label>
				<input type="date" name="endDate">

				<label for="courseType">Course Type:</label>
				<select name="courseType">
						<option value="ALL">All courses</option>
						<option value="INTERNAL">INTERNAL</option>
						<option value="EXTERNAL">EXTERNAL</option>
						<option value="PROFESSIONAL">PROFESSIONAL</option>
				</select>

				<button type="submit">Search</button>

		</form>

	
    <h2>Pending approvals by subordinate</h2>
    <p th:if="${#maps.isEmpty(pendingGroups)}">No applications awaiting approval.</p>
    <section th:each="group : ${pendingGroups}">
        <h3 th:text="${group.key}"></h3>
        <div th:replace="~{fragments/applicationlist :: applicationListWithName(${group.value})}"></div>
    </section>
    <form th:action="@{/manager/applications}" method="get">
      <label>Results per page <select name="pageSize" onchange="this.form.submit()">
        <option th:each="n : ${pageSizes}" th:value="${n}" th:text="${n}" th:selected="${n == pageSize}"></option>
      </select></label>
    </form>
    <nav class="pagination" aria-label="Pending approval pages">
      <a th:if="${pageNum > 0}" th:href="@{/manager/applications(pageNum=${pageNum - 1},pageSize=${pageSize})}">Previous</a><span class="pagination-placeholder" aria-hidden="true" th:unless="${pageNum > 0}">Previous</span>
      <span th:text="|${pageNum + 1} / ${totalPages == 0 ? 1 : totalPages}|"></span>
      <a th:if="${pageNum + 1 < totalPages}" th:href="@{/manager/applications(pageNum=${pageNum + 1},pageSize=${pageSize})}">Next</a><span class="pagination-placeholder" aria-hidden="true" th:unless="${pageNum + 1 < totalPages}">Next</span>
    </nav>


    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
