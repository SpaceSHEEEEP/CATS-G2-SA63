<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" th:href="@{/style.css}" />
    <title>Training Calendar</title>

    <script
      th:src="@{/js/daypilot/daypilot-all.min.js}"
      defer
    ></script>
    <script th:src="@{/js/calendar.js}" defer></script>
	
	<style>
	  #calendar-view-buttons button[aria-pressed="true"] {
	    outline: 2px solid #111827;
	    font-weight: bold;
	  }
	</style>
  </head>

  <body>
    <div th:replace="~{fragments/header :: header}"></div>

	<h1 id="calendar-title">My Training Calendar</h1>

	<h2 id="calendar-month-heading"th:text="${currentMonth + ' ' + currentYear}">
	  Selected month
	</h2>

	<div id="calendar-view-buttons" role="group" aria-label="Training view">
	  <button type="button" id="my-training" aria-pressed="true">
	    My Training
	  </button>

	  <button type="button" id="all-staff-training" aria-pressed="false">
	    All Staff Training
	  </button>
	</div>

	<p id="calendar-view-description">
	  Your applied, updated and approved training.
	</p>

	<div role="group" aria-label="Month navigation">
	  <button type="button" id="previous-month">Previous month</button>
	  <button type="button" id="today-month">Today</button>
	  <button type="button" id="next-month">Next month</button>
	</div>

    <div class="year-month-filter-container">
      <form id="calendar-month-form" th:action="@{/staff/calendar}" method="get">
        <label for="calendar-year">Year:</label>
        <select id="calendar-year" name="year">
          <option
            th:each="yr : ${years}"
            th:value="${yr}"
            th:text="${yr}"
            th:selected="${yr == currentYear}"
          ></option>
        </select>

        <label for="calendar-month">Month:</label>
        <select id="calendar-month" name="month">
          <option
            th:each="mth : ${months}"
            th:value="${mth}"
            th:text="${mth}"
            th:selected="${mth.toUpperCase() == currentMonth}"
          ></option>
        </select>

        <button type="submit">Select</button>
      </form>
    </div>
	
	<label for="calendar-category">Course category:</label>

	<select id="calendar-category">
	  <option value="">All categories</option>
	  <option value="INTERNAL">Internal Training</option>
	  <option value="EXTERNAL">External Course</option>
	  <option value="PROFESSIONAL">Professional Certification</option>
	</select>

    <p>
      Approved training uses solid colours.
      Applied and updated training uses pale colours.
    </p>

    <p id="calendar-message" role="status" aria-live="polite"></p>

    <div
      id="dp"
      th:data-start="${calendarStart}"
      th:data-events-url="@{/staff/calendar/events}"
      th:data-login-url="@{/staff/login}"
    ></div>
  </body>
</html>
