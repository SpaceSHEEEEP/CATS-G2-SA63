<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="EN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/style.css}" />
  <title>Application Details</title>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- display error message if managerReason is not filled -->
    <div th:if="${errormsg}" th:text="${errormsg}" class="global-error-message"></div>

    <h1>Application Details</h1>

    <div class="details-card">
        
        <!-- TODO: replace below with applicationDetails -->
        <th:block th:replace="~{fragments/applicationlist :: applicationDetails(app=${applicationResult})}"></th:block>


        <th:block th:unless="${#strings.isEmpty(#strings.trim(applicationResult.managerReason))}">
            <div th:replace="~{fragments/formactions :: showManagerReason(app=${applicationResult})}"></div>
        </th:block>

        <!-- TODO: display comment! need to go to application controller and give completed comment to here -->
        <th:block th:if="${comment}">
        <th:block th:unless="${#strings.isEmpty(#strings.trim(comment.commentText))}">
            <div th:replace="~{fragments/formactions :: showComment(comment=${comment})}"></div>
        </th:block>
        </th:block>

        <th:block th:unless="${applicationResult.status.name() == 'DELETED' or 
                               applicationResult.status.name() == 'REJECTED' or 
                               applicationResult.status.name() == 'CANCELLED' or 
                               applicationResult.status.name() == 'COMPLETED'}">

            <th:block th:if="${viewer == 'mine'}">
                <th:block th:if="${applicationResult.status.name() == 'APPLIED' or applicationResult.status.name() == 'UPDATED'}">
                    <div th:replace="~{fragments/formactions :: editOrDelete(app=${applicationResult})}"></div>
                </th:block>

                <th:block th:if="${applicationResult.status.name() == 'APPROVED'}">
                    <div th:replace="~{fragments/formactions :: cancelOrComplete(app=${applicationResult}, comment=${comment})}"></div>
                </th:block>
            </th:block>

            <th:block th:if="${viewer == 'manager'}">
                <section th:if="${approvalBudget}">
                    <h3>Subordinate annual training utilisation</h3>
                    <p>Year <span th:text="${approvalBudget.year}"></span> — days committed:
                    <span th:text="${approvalBudget.daysCommitted}"></span>, days completed:
                    <span th:text="${approvalBudget.daysCompleted}"></span>, days remaining:
                    <span th:text="${approvalBudget.daysRemaining}"></span>, fees committed:
                    <span th:text="${approvalBudget.feesCommitted}"></span>, budget remaining:
                    <span th:text="${approvalBudget.budgetRemaining}"></span>.</p>
                </section>
                <h3>Other subordinates' approved courses overlapping this period</h3>
                <p th:if="${#lists.isEmpty(overlappingApprovedCourses)}">No overlapping approved courses.</p>
                <ul><li th:each="other : ${overlappingApprovedCourses}"
                    th:text="${other.user.name + ': ' + other.course.courseName + ' (' + other.course.startDate + ' to ' + other.course.endDate + ')'}"></li></ul>
                <th:block th:if="${applicationResult.status.name() == 'APPLIED' or applicationResult.status.name() == 'UPDATED'}">
                    <div th:replace="~{fragments/formactions :: approveOrReject(app=${applicationResult})}"></div>
                </th:block>
            </th:block>

        </th:block>
        <p th:if="${viewer == 'mine' and applicationResult.status.name() == 'COMPLETED' and applicationResult.course.courseType.name() != 'INTERNAL' and applicationResult.course.fee.signum() > 0}">
          <a th:href="@{/staff/claim(applicationId=${applicationResult.id})}">Claim course fee reimbursement</a>
        </p>
    </div>

</body>
</html>
