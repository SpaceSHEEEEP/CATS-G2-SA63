<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="EN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/style.css}" />
  <title>Application Details</title>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <h1>Application Details</h1>

    <div class="details-card">
        
        <dl class="details-grid">
            <dt>Application ID</dt>
            <dd th:text="${applicationResult.id}"></dd>

            <dt>Course Name</dt>
            <dd th:text="${applicationResult.course.courseName}"></dd>

            <dt>Course Type</dt>
            <dd><span class="badge" th:text="${applicationResult.course.courseType}"></span></dd>

            <dt>Start Date</dt>
            <dd th:text="${applicationResult.course.startDate}"></dd>

            <dt>End Date</dt>
            <dd th:text="${applicationResult.course.endDate}"></dd>

            <dt>Duration</dt>
            <dd th:text="${applicationResult.course.duration}"></dd>

            <dt>Training Provider</dt>
            <dd th:text="${applicationResult.course.trainingProvider}"></dd>

            <dt>Location</dt>
            <dd th:text="${applicationResult.course.location}"></dd>

            <dt>Fee</dt>
            <dd>$<span th:text="${applicationResult.course.fee}"></span></dd>

            <dt>Justification</dt>
            <dd class="full-width" th:text="${applicationResult.userReason}"></dd>

            <dt>Status</dt>
            <dd><span th:text="${applicationResult.status}"></span></dd>
        </dl>


        <div th:if="${viewer == 'mine'}">
            <th:block th:unless="${#strings.isEmpty(#strings.trim(applicationResult.managerReason))}">
                <div th:replace="~{fragments/formactions :: showManagerReason(app=${applicationResult})}"></div>
            </th:block>

            <th:block th:if="${applicationResult.status.name() == 'APPROVED'}">
                <div th:replace="~{fragments/formactions :: cancelOrComplete(app=${applicationResult})}"></div>
            </th:block>

            <th:block th:unless="${applicationResult.status.name() == 'APPROVED' or 
                                   applicationResult.status.name() == 'REJECTED' or 
                                   applicationResult.status.name() == 'DELETED'}">
                <div th:replace="~{fragments/formactions :: editOrDelete(app=${applicationResult})}"></div>
            </th:block>
        </div>

        <div th:if="${viewer == 'manager'}">
            <th:block th:if="${applicationResult.status.name() == 'APPROVED'}">
                <div th:replace="~{fragments/formactions :: showManagerReason(app=${applicationResult})}"></div>
            </th:block>
            <th:block th:unless="${applicationResult.status.name() == 'APPROVED' or applicationResult.status.name() == 'DELETED'}">
                <div th:replace="~{fragments/formactions :: approveOrReject(app=${applicationResult})}"></div>
            </th:block>
        </div>
    </div>

</body>
</html>
