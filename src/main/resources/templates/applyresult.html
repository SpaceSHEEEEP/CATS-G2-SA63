<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="EN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/style.css}" />
  <title>Application Details</title>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <h1>Application Details</h1>

    <div class="details-card">
        
        <!-- TODO: replace below with applicationDetails -->
        <th:block th:replace="~{fragments/applicationlist :: applicationDetails(app=${applicationResult})}"></th:block>


        <th:block th:unless="${#strings.isEmpty(#strings.trim(applicationResult.managerReason))}">
            <div th:replace="~{fragments/formactions :: showManagerReason(app=${applicationResult})}"></div>
        </th:block>

        <!-- TODO: display comment! need to go to application controller and give completed comment to here -->
        <!-- <th:block th:if="${comment}"> -->
        <!-- <th:block th:unless="${#strings.isEmpty(#strings.trim(comment.commentText))}"> -->
        <!--     <div th:replace="~{fragments/formactions :: showComment(comment=${comment})}"></div> -->
        <!-- </th:block> -->
        <!-- </th:block> -->

        <th:block th:unless="${applicationResult.status.name() == 'DELETED' or 
                               applicationResult.status.name() == 'REJECTED' or 
                               applicationResult.status.name() == 'CANCELLED' or 
                               applicationResult.status.name() == 'COMPLETED'}">

            <th:block th:if="${viewer == 'mine'}">
                <th:block th:if="${applicationResult.status.name() == 'APPLIED'}"> 
                    <div th:replace="~{fragments/formactions :: editOrDelete(app=${applicationResult})}"></div>
                </th:block>

                <th:block th:if="${applicationResult.status.name() == 'APPROVED'}">
                    <div th:replace="~{fragments/formactions :: cancelOrComplete(app=${applicationResult}, comment=${comment})}"></div>
                </th:block>
            </th:block>

            <th:block th:if="${viewer == 'manager'}">
                <th:block th:if="${applicationResult.status.name() == 'APPLIED' or applicationResult.status.name() == 'UPDATED'}">
                    <div th:replace="~{fragments/formactions :: approveOrReject(app=${applicationResult})}"></div>
                </th:block>
            </th:block>

        </th:block>
    </div>

</body>
</html>
