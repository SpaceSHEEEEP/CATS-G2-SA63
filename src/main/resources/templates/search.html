<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Application Search Results</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <h1>Application Search Results</h1>
    
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <p th:text="'Results on this page: ' + ${#lists.size(searchApplications)}"></p>
    <p th:if="${#lists.isEmpty(searchApplications)}">No applications found.</p>
    <table th:unless="${#lists.isEmpty(searchApplications)}">
        <thead>
            <tr>
                <th>Employee</th>
                <th>Course</th>
                <th>Course Type</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Fee (SGD)</th>
                <th>Justification</th>
                <th>Status</th>
				<th>Manager Remarks</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="app : ${searchApplications}">
                <td th:text="${app.user.name}"></td>
                <td th:text="${app.course.courseName}"></td>
                <td th:text="${app.course.courseType}"></td>
                <td th:text="${app.course.startDate}"></td>
                <td th:text="${app.course.endDate}"></td>
                <td th:text="${app.course.fee}"></td>
                <td th:text="${app.userReason}"></td>
                <td th:text="${app.status}"></td>
				<td th:text="${app.managerReason}"></td>
            </tr>

        </tbody>

    </table>

    <form method="get" th:action="@{/manager/applications/search}">
      <input type="hidden" name="employeeName" th:value="${employeeName}" />
      <input type="hidden" name="startDate" th:value="${startDate}" />
      <input type="hidden" name="endDate" th:value="${endDate}" />
      <input type="hidden" name="courseType" th:value="${courseType}" />
      <label>Results per page <select name="pageSize" onchange="this.form.submit()">
        <option th:each="n : ${pageSizes}" th:value="${n}" th:text="${n}" th:selected="${n == pageSize}"></option>
      </select></label>
    </form>
    <nav aria-label="Manager search pages">
      <a th:if="${pageNum > 0}" th:href="@{/manager/applications/search(employeeName=${employeeName},startDate=${startDate},endDate=${endDate},courseType=${courseType},pageSize=${pageSize},pageNum=${pageNum - 1})}">Previous</a>
      <span th:text="|${pageNum + 1} / ${totalPages == 0 ? 1 : totalPages}|"></span>
      <a th:if="${pageNum + 1 < totalPages}" th:href="@{/manager/applications/search(employeeName=${employeeName},startDate=${startDate},endDate=${endDate},courseType=${courseType},pageSize=${pageSize},pageNum=${pageNum + 1})}">Next</a>
    </nav>
    <p><a th:href="@{/manager/reports}">Accurate training, budget and claims reports</a></p>
    <a th:href="@{/manager/applications}">Back to pending applications</a>

</body>
</html>
