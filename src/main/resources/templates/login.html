<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${adminLogin} ? 'Administrator Login' : 'Staff Login'"></title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
    <h1 th:text="${adminLogin} ? 'Administrator Login' : 'Staff Login'">Staff Login</h1>

    <p th:if="${adminLogin}">Sign in with an administrator account to access admin features.</p>
    <p th:unless="${adminLogin}">Sign in to manage your training applications.</p>

    <form th:object="${login}"
          th:action="${adminLogin} ? @{/admin/login} : @{/staff/login}"
          method="post">

        <fieldset>
            <label for="username">Username</label>
            <input type="text" th:field="*{username}"
                   autocomplete="username" required
                   autofocus>
        </fieldset>

        <fieldset>
            <label for="password">Password</label>
            <input type="password" th:field="*{password}"
                   autocomplete="current-password" required>
        </fieldset>

        <button type="submit">Log in</button>
    </form>

    <!-- TODO: what does role do? -->
    <p th:if="${msg}" th:text="${msg}" role="alert"></p>

    <a th:if="${adminLogin}" th:href="@{/staff/login}">Back to staff login</a>
    <a th:unless="${adminLogin}" th:href="@{/admin/login}">Administrator login</a>
</body>
</html>
