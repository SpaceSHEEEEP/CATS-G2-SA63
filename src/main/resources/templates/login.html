<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${adminLogin == true}
            ? 'Administrator Login' : 'Staff Login'">
        Staff Login
    </title>
</head>
<body>
    <h1 th:text="${adminLogin == true}
            ? 'Administrator Login' : 'Staff Login'">
        Staff Login
    </h1>

    <p th:if="${adminLogin == true}">
        Sign in with an administrator account to access admin features.
    </p>

    <p th:unless="${adminLogin == true}">
        Sign in to manage your training applications.
    </p>

    <form th:object="${login}"
          th:action="${adminLogin == true}
              ? @{/admin/login} : @{/staff/login}"
          method="post">

        <label for="username">Username</label>
        <input type="text" th:field="*{username}"
               autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" th:field="*{password}"
               autocomplete="current-password" required>

        <button type="submit">Log in</button>
    </form>

    <p th:if="${msg}" th:text="${msg}" role="alert"></p>

    <a th:unless="${adminLogin == true}" th:href="@{/admin/login}">
        Administrator login
    </a>

    <a th:if="${adminLogin == true}" th:href="@{/staff/login}">
        Back to staff login
    </a>
</body>
</html>
