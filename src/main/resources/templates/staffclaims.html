<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" th:href="@{/images/cats/celebrate.png}" />
    <title>My reimbursement claims</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <h1>My course fee reimbursement claims</h1><p th:if="${param.captchaError}" role="alert">Verification failed. Return to the claim form and try a new challenge.</p>
    <p th:if="${#lists.isEmpty(claims)}" class="cats-empty-state">
      <img th:src="@{/images/cats/tearful.png}" alt="" />No claims on this page
      yet.
    </p>
    <table>
      <thead>
        <tr>
          <th>Course</th>
          <th>Submitted</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Manager decision reason</th>
          <th>Paid on / reference</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="claim : ${claims}">
          <td class="course-name" th:text="${claim.application.course.courseName}"></td>
          <td th:text="${claim.submittedOn}"></td>
          <td th:text="${claim.amount}"></td>
          <td><span class="status-text" th:attr="data-status=${claim.status}" th:text="${claim.status}"></span></td>
          <td th:text="${claim.managerReason}"></td>
          <td
            th:text="${claim.paidOn == null ? '-' : (claim.paidOn + ' / ' + claim.paymentReference)}"
          ></td>
          <td class="row-actions-cell">
              <div class="row-actions">
              <a class="row-action-icon" title="View receipt" aria-label="View receipt" th:href="@{/staff/claims/{id}/receipt(id=${claim.id})}">
              <svg class="row-action-svg" aria-hidden="true">
              <use href="/images/icons/action-icons.svg#eye">
              </use>
              </svg>
              </a>
              <button class="row-action-icon " type="button" title="Other claim evidence" aria-label="Other claim evidence" th:attr="popovertarget=|staff-claim-${claim.id}|">
              <svg class="row-action-svg" aria-hidden="true">
              <use href="/images/icons/action-icons.svg#more">
              </use>
              </svg>
              </button>
              <div class="row-action-menu" popover="auto" th:id="|staff-claim-${claim.id}|">
              <a th:href="@{/staff/claims/{id}/certificate(id=${claim.id})}">View certificate</a>
              </div>
              </div>
            </td>
        </tr>
      </tbody>
    </table>
    <nav class="pagination" aria-label="Fee claim pages">
      <a
        th:if="${page.hasPrevious()}"
        th:href="@{/staff/claims(page=${page.number - 1})}"
        >Previous</a
      >
      <span
        th:text="|Page ${page.number + 1} of ${page.totalPages == 0 ? 1 : page.totalPages}|"
      ></span>
      <a
        th:if="${page.hasNext()}"
        th:href="@{/staff/claims(page=${page.number + 1})}"
        >Next</a
      >
    </nav>
      <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
