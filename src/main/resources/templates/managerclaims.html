<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" th:href="@{/images/cats/celebrate.png}" />
    <title>Direct subordinate claims</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="cats-page-heading">
      <img th:src="@{/images/cats/thoughtful.png}" alt="" />
      <h1>Direct Subordinate Claims</h1>
    </div>
    <p th:if="${successmsg}" th:text="${successmsg}"></p>
    <p th:if="${errormsg}" th:text="${errormsg}" role="alert"></p>
    <p>Only claims belonging to your direct subordinates are actionable.</p>
    <table>
      <thead>
        <tr>
          <th>Employee</th>
          <th>Course</th>
          <th>Claimed</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Decision reason</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(claims)}" class="table-empty-row">
          <td colspan="7"><div class="table-empty-state">
            <img th:src="@{/images/cats/tearful.png}" alt="" />
            <p>No claims on this page yet.</p>
          </div></td>
        </tr>
        <tr th:each="claim : ${claims}">
          <td>
            <a
              th:href="@{/manager/ledger(employeeId=${claim.employee.userId})}"
              th:text="${claim.employee.name}"
            ></a>
          </td>
          <td th:text="${claim.application.course.courseName}"></td>
          <td th:text="${claim.submittedOn}"></td>
          <td th:text="${claim.amount}"></td>
          <td><span class="status-text" th:attr="data-status=${claim.status}" th:text="${claim.status}"></span></td>
          <td th:text="${claim.managerReason}"></td>
          <td class="row-actions-cell">
              <div class="row-actions">
              <th:block th:if="${claim.status.name() == 'SUBMITTED'}">
              <button type="button" class="js-confirm-action row-action-icon" aria-label="Approve claim" title="Approve claim" data-confirm-phrase="APPROVE" data-confirm-title="Approve reimbursement claim" data-confirm-message="Check the uploaded evidence and supply a decision reason before approving." data-confirm-button="Approve" th:attr="data-confirm-action=@{/manager/claims/decision(claimId=${claim.id},status=APPROVED)},data-confirm-subject=${claim.application.course.courseName}" data-confirm-extra="reason" data-confirm-extra-label="Decision reason" data-confirm-extra-max="1000" data-confirm-danger="false">
              <svg class="row-action-svg" aria-hidden="true">
              <use href="/images/icons/action-icons.svg#check">
              </use>
              </svg>
              </button>
              </th:block>
              <button class="row-action-icon " type="button" title="Claim actions and evidence" aria-label="Claim actions and evidence" th:attr="popovertarget=|manager-claim-${claim.id}|">
              <svg class="row-action-svg" aria-hidden="true">
              <use href="/images/icons/action-icons.svg#more">
              </use>
              </svg>
              </button>
              <div class="row-action-menu" popover="auto" th:id="|manager-claim-${claim.id}|">
              <th:block th:if="${claim.status.name() == 'SUBMITTED'}">
              <button type="button" class="js-confirm-action row-action-menu-item row-action-menu-danger" aria-label="Reject claim" title="Reject claim" data-confirm-phrase="REJECT" data-confirm-title="Reject reimbursement claim" data-confirm-message="This rejects the reimbursement request. Review evidence and give the employee a meaningful reason." data-confirm-button="Reject" th:attr="data-confirm-action=@{/manager/claims/decision(claimId=${claim.id},status=REJECTED)},data-confirm-subject=${claim.application.course.courseName}" data-confirm-extra="reason" data-confirm-extra-label="Rejection reason" data-confirm-extra-max="1000">Reject claim</button>
              </th:block>
              <a th:href="@{/staff/claims/{id}/receipt(id=${claim.id})}">View receipt</a>
              <a th:href="@{/staff/claims/{id}/certificate(id=${claim.id})}">View certificate</a>
              </div>
              </div>
            </td>
        </tr>
      </tbody>
    </table>
    <nav>
      <a
        th:if="${page.hasPrevious()}"
        th:href="@{/manager/claims(page=${page.number-1})}"
        >Previous</a
      >
      <span
        th:text="|Page ${page.number+1} of ${page.totalPages == 0 ? 1 : page.totalPages}|"
      ></span>
      <a
        th:if="${page.hasNext()}"
        th:href="@{/manager/claims(page=${page.number+1})}"
        >Next</a
      >
    </nav>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
