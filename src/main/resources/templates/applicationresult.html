<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="EN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/style.css}" />
  <title>Application Details</title>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <h1>Application Details</h1>

    <div class="details-card">
        
        <dl class="details-grid">
            <dt>Application ID</dt>
            <dd th:text="${applicationResult.id}"></dd>

            <dt>Course Name</dt>
            <dd th:text="${applicationResult.course.courseName}"></dd>

            <dt>Course Type</dt>
            <dd><span class="badge" th:text="${applicationResult.course.courseType}"></span></dd>

            <dt>Start Date</dt>
            <dd th:text="${applicationResult.course.startDate}"></dd>

            <dt>End Date</dt>
            <dd th:text="${applicationResult.course.endDate}"></dd>

            <dt>Duration</dt>
            <dd th:text="${applicationResult.course.duration}"></dd>

            <dt>Training Provider</dt>
            <dd th:text="${applicationResult.course.trainingProvider}"></dd>

            <dt>Location</dt>
            <dd th:text="${applicationResult.course.location}"></dd>

            <dt>Fee</dt>
            <dd>$<span th:text="${applicationResult.course.fee}"></span></dd>

            <dt>Justification</dt>
            <dd class="full-width" th:text="${applicationResult.userReason}"></dd>

            <dt>Status</dt>
            <dd><span th:text="${applicationResult.status}"></span></dd>
        </dl>

        <div class="actions">
            <a th:href="@{/staff/edit(id=${applicationResult.id})}" class="btn btn-primary">Edit</a>
            <!-- TODO: have like a pop up that says "are you sure?" maybe use javascript alert? idk -->
            <form th:action="@{/staff/delete(id=${applicationResult.id})}" method="POST" style="display:inline;">
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>
                <!-- TODO: do survey first, then mark as complete -->
                <!-- so action send to staff/survey etc etc -->
            <form th:if="${applicationResult.status.name() == 'APPROVED'}"
                  th:action="@{/staff/completed(id=${applicationResult.id})}"
                  method="post">
                <button type="submit">COMPLETED</button>
            </form>
        </div>
    </div>

</body>
</html>
