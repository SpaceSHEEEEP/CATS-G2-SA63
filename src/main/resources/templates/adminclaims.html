<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" th:href="@{/images/cats/celebrate.png}" />
    <title>Reimbursement disbursements</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <h1>Confirmed reimbursement disbursements</h1>
    <p>
      Record a payment only after the external payment has actually been made.
      This screen does not initiate a bank transfer.
    </p>
    <p th:if="${successmsg}" th:text="${successmsg}"></p>
    <p th:if="${errormsg}" th:text="${errormsg}" role="alert"></p>
    <table>
      <thead>
        <tr>
          <th>Employee</th>
          <th>Course</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Paid on</th>
          <th>Payment reference</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="claim : ${claims}">
          <td th:text="${claim.employee.name}"></td>
          <td th:text="${claim.application.course.courseName}"></td>
          <td th:text="${claim.amount}"></td>
          <td><span class="status-text" th:attr="data-status=${claim.status}" th:text="${claim.status}"></span></td>
          <td th:text="${claim.paidOn}"></td>
          <td th:text="${claim.paymentReference}"></td>
          <td class="row-actions-cell">
              <div class="row-actions">
              <th:block th:if="${claim.status.name() == 'APPROVED'}">
              <button type="button" class="js-confirm-action row-action-icon" aria-label="Record payment" title="Record payment" data-confirm-phrase="PAID" data-confirm-title="Record external reimbursement as paid" data-confirm-message="Only proceed after payment has actually cleared. This records payment; it does not transfer funds." data-confirm-button="Record paid" th:attr="data-confirm-action=@{/admin/claims/pay(claimId=${claim.id})},data-confirm-subject=${claim.application.course.courseName}" data-confirm-extra="paymentReference" data-confirm-extra-label="Bank / payment reference" data-confirm-extra-max="120" data-confirm-danger="false">
              <svg class="row-action-svg" aria-hidden="true">
              <use href="/images/icons/action-icons.svg#card">
              </use>
              </svg>
              </button>
              </th:block>
              <button class="row-action-icon " type="button" title="Claim details and evidence" aria-label="Claim details and evidence" th:attr="popovertarget=|admin-claim-${claim.id}|">
              <svg class="row-action-svg" aria-hidden="true">
              <use href="/images/icons/action-icons.svg#more">
              </use>
              </svg>
              </button>
              <div class="row-action-menu" popover="auto" th:id="|admin-claim-${claim.id}|">
              <a th:href="@{/staff/claims/{id}/receipt(id=${claim.id})}">View receipt</a>
              <a th:href="@{/staff/claims/{id}/certificate(id=${claim.id})}">View certificate</a>
              </div>
              </div>
            </td>
        </tr>
      </tbody>
    </table>
    <nav>
      <a
        th:if="${page.hasPrevious()}"
        th:href="@{/admin/claims(page=${page.number-1})}"
        >Previous</a
      >
      <span
        th:text="|Page ${page.number+1} of ${page.totalPages == 0 ? 1 : page.totalPages}|"
      ></span>
      <a
        th:if="${page.hasNext()}"
        th:href="@{/admin/claims(page=${page.number+1})}"
        >Next</a
      >
    </nav>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
