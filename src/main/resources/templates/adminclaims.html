<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Reimbursement disbursements</title><link rel="stylesheet" th:href="@{/style.css}" /></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<h1>Confirmed reimbursement disbursements</h1>
<p>Record a payment only after the external payment has actually been made.
   This screen does not initiate a bank transfer.</p>
<p th:if="${successmsg}" th:text="${successmsg}"></p><p th:if="${errormsg}" th:text="${errormsg}" role="alert"></p>
<table><thead><tr><th>Employee</th><th>Course</th><th>Amount</th><th>Status</th>
  <th>Paid on</th><th>Payment reference</th><th>Evidence</th><th>Record paid</th></tr></thead>
<tbody><tr th:each="claim : ${claims}">
  <td th:text="${claim.employee.name}"></td><td th:text="${claim.application.course.courseName}"></td>
  <td th:text="${claim.amount}"></td><td th:text="${claim.status}"></td>
  <td th:text="${claim.paidOn}"></td><td th:text="${claim.paymentReference}"></td>
  <td><a th:href="@{/staff/claims/{id}/receipt(id=${claim.id})}">Receipt</a> ·
      <a th:href="@{/staff/claims/{id}/certificate(id=${claim.id})}">Certificate</a></td>
  <td><form th:if="${claim.status.name() == 'APPROVED'}" method="post" th:action="@{/admin/claims/pay}">
    <input type="hidden" name="claimId" th:value="${claim.id}" />
    <input name="paymentReference" required maxlength="120" placeholder="Bank / payout reference" />
    <button type="submit">Confirm paid</button>
  </form></td></tr></tbody></table>
<nav><a th:if="${page.hasPrevious()}" th:href="@{/admin/claims(page=${page.number-1})}">Previous</a>
<span th:text="|Page ${page.number+1} of ${page.totalPages == 0 ? 1 : page.totalPages}|"></span>
<a th:if="${page.hasNext()}" th:href="@{/admin/claims(page=${page.number+1})}">Next</a></nav>
</body></html>
