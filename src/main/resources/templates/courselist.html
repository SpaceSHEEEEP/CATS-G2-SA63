<!-- this shows a list of internal courses one can apply to -->
<!DOCTYPE html>
<html lang="en">
<head xmlns="http://www.thymeleaf.org">
	<title>Internal Course</title>
</head>
<body>
	<a th:href="@{/staff/index}">Back to Home</a>
	<h1>Internal Courses</h1>
	
	<p th:if="${#lists.isEmpty(courselist)}">No Internal Courses Available.</p>
	
	<table th:unless="${#lists.isEmpty(courselist)}">
		<thead>
			<tr>
				<th>Course</th>
				<th>Start date</th>
				<th>End date</th>
				<th>Provider</th>
				<th>Location</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="course : ${courselist}">
				<td th:text="${course.courseName}"></td>
				<td th:text="${course.startDate}"></td>
				<td th:text="${course.endDate}"></td>
				<td th:text="${course.trainingProvider}"></td>
				<td th:text="${course.location}"></td>
				<td>
				    <a th:href="@{/employee/apply/{id}(id=${course.courseId})}">
				        Apply
				    </a>
				</td>
			</tr>
		</tbody>	
	</table>
</body>
</html>
