spring.application.name=cats

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

cats.public-base-url=${PUBLIC_BASE_URL:}
cats.mail.dispatch-delay-ms=${MAIL_DISPATCH_DELAY_MS:60000}

# Optional Telegram bot: allowlist required, deny by default.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${ADMIN_MAIL_USERNAME:}
spring.mail.password=${ADMIN_MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# One-time opt-in provisioning: requires all BOOTSTRAP_ADMIN_* values, no default user/password.
cats.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
cats.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
cats.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
cats.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
cats.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB

cats.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}
cats.mobile.token-days=${MOBILE_TOKEN_DAYS:30}
cats.mobile.android-origins=${MOBILE_CORS_ORIGINS:https://localhost,capacitor://localhost}
cats.mobile.apk-path=${MOBILE_APK_PATH:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
