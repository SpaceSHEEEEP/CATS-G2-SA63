spring.application.name=cats

# Connection to MySQL DB
# spring.datasource.url=jdbc:mysql://localhost:3306/cats?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN}

#for email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${ADMIN_MAIL_USERNAME}
spring.mail.password=${ADMIN_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true
#spring.mail.properties.mail.smtp.connectiontimeout=5000
#spring.mail.properties.mail.smtp.timeout=5000
#spring.mail.properties.mail.smtp.writetimeout=5000



spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Session is connecting the java program to db
# false connection to the DB pool conserved
spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Load data.sql into MySQL after Hibernate has created the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Show the exception message on the error page (e.g. "Employee x not found")
server.error.include-message=always
