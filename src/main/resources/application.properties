spring.application.name=cats

# Database connection is supplied by the runtime environment.
# Do not commit real database credentials to source control.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns schema creation and evolution. Hibernate only validates that
# the entity mappings still match the migrated database schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Session is connecting the java program to db
# false connection to the DB pool conserved
spring.jpa.open-in-view=false

# Do not mix Spring's basic SQL initializer with Flyway migrations.
spring.sql.init.mode=never

# Show the exception message on the error page (e.g. "Employee x not found")
server.error.include-message=always
